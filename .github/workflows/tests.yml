---
name: Tests and Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality Checks
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # Python comes from .python-version (3.14) via uv's managed interpreters.
      - name: Sync dependencies
        run: uv sync

      # Also runs the ty-check hook over calculations/, so no separate type-check step.
      - name: Run prek checks
        run: uv run prek --all-files

      - name: Run tests
        run: |
          uv run coverage run --source=src/chebin -m pytest tests/ -v
          uv run coverage report -m

  # Packaging is wired up: pyproject sets `package = true` with the uv_build backend
  # over the src/ layout. Manual-dispatch only until we publish on a release trigger.
  build:
    runs-on: ubuntu-latest
    name: Build and Package
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package
          path: dist/
