---
name: Tests and Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality Checks
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v2.1.7

      - name: Set up Python
        uses: actions/setup-python@42bef2e9e2b1c0aec8e21f4d02eed36c4f2e0c5f  # v4.12.0
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Run prek checks
        run: uv run prek --all-files

      - name: Run tests
        run: uv run pytest tests/ -v --cov=calculations --cov-report=term-missing

      - name: Type check
        run: uv run pyright calculations/

  build:
    runs-on: ubuntu-latest
    name: Build and Package
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332  # v4.1.7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@5d5d22a31266ced268874388b861e4b58bb5c2f3  # v2.1.7

      - name: Set up Python
        uses: actions/setup-python@42bef2e9e2b1c0aec8e21f4d02eed36c4f2e0c5f  # v4.12.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.3.1
        with:
          name: python-package
          path: dist/
