[project]
name = "chebin"
version = "0.0.1"
description = "ChEBI-N enrichment analysis tooling"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.3",
  "networkx>=3.6.1",
  "numpy>=2.5.2",
  "pandas>=3.0.5",
  "py-horned-owl>=1.4.1",
  "rdkit>=2026.3.5",
  "requests>=2.34.2",
  "scipy>=1.18.0",
]

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "great-docs>=0.16.0",
  "prek>=0.4.13",
  "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.deptry]
ignore_notebooks = true
known_first_party = ["calculations", "old_scripts", "preparing_data", "website"]

[tool.deptry.package_module_name_map]
py-horned-owl = ["pyhornedowl"]

[tool.typos.default.extend-words]
# "cose" is the Cytoscape.js Compound Spring Embedder layout, not a typo of
# "case". Without this the typos hook rewrites it and breaks graph rendering
# in website/templates/graph.html (reverted before in 6f97f56 and 24db0a0).
cose = "cose"

[tool.uv]
package = false
